backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

site_url: https://benjaaddo.netlify.app
display_url: https://benjaaddo.netlify.app

collections:
  - name: "site"
    label: "Site Settings"
    files:
      - file: "content/site.json"
        label: "Logo & Global Settings"
        name: "site"
        fields:
          - { label: "Site Logo", name: "logo", widget: "image", hint: "Shown in the navigation bar on every page." }

  - name: "about"
    label: "About Page"
    files:
      - file: "content/about.json"
        label: "About Content"
        name: "about"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lede", name: "lede", widget: "text" }
          - label: "Paragraphs"
            name: "paragraphs"
            widget: "list"
            hint: "Wrap words in **double asterisks** to make them bold."
            field: { label: "Paragraph", name: "text", widget: "text" }
          - label: "Guiding Principles"
            name: "principles"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - label: "Cards"
                name: "cards"
                widget: "list"
                summary: "{{title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }

  - name: "experience"
    label: "Experience Page"
    files:
      - file: "content/experience.json"
        label: "Experience Content"
        name: "experience"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lede", name: "lede", widget: "text" }
          - label: "Clusters"
            name: "clusters"
            widget: "list"
            summary: "{{label}}"
            hint: "A cluster groups related roles under one label, e.g. 'Legal & Student Governance'."
            fields:
              - { label: "Cluster Label", name: "label", widget: "string" }
              - label: "Entries"
                name: "entries"
                widget: "list"
                summary: "{{org}} — {{title}}"
                fields:
                  - { label: "Organization", name: "org", widget: "string" }
                  - { label: "Date Range", name: "date", widget: "string" }
                  - { label: "Title/Role", name: "title", widget: "string" }
                  - label: "Paragraphs"
                    name: "paragraphs"
                    widget: "list"
                    field: { label: "Paragraph", name: "text", widget: "text" }

  - name: "education"
    label: "Education Page"
    files:
      - file: "content/education.json"
        label: "Education Content"
        name: "education"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lede", name: "lede", widget: "text" }
          - label: "Entries"
            name: "entries"
            widget: "list"
            summary: "{{org}} — {{title}}"
            fields:
              - { label: "Institution", name: "org", widget: "string" }
              - { label: "Date Range", name: "date", widget: "string" }
              - { label: "Qualification", name: "title", widget: "string" }
              - label: "Paragraphs"
                name: "paragraphs"
                widget: "list"
                field: { label: "Paragraph", name: "text", widget: "text" }

  - name: "skills"
    label: "Skills Page"
    files:
      - file: "content/skills.json"
        label: "Skills Content"
        name: "skills"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Lede", name: "lede", widget: "text" }
          - label: "Core Competencies"
            name: "competencies"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - label: "Cards"
                name: "cards"
                widget: "list"
                summary: "{{title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - label: "Paragraphs"
                    name: "paragraphs"
                    widget: "list"
                    field: { label: "Paragraph", name: "text", widget: "text" }
          - label: "AI Literacy"
            name: "aiLiteracy"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - label: "Cards"
                name: "cards"
                widget: "list"
                summary: "{{title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - label: "Paragraphs"
                    name: "paragraphs"
                    widget: "list"
                    field: { label: "Paragraph", name: "text", widget: "text" }
          - label: "Awards & Recognition"
            name: "awards"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - label: "Cards"
                name: "cards"
                widget: "list"
                summary: "{{title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - label: "Paragraphs"
                    name: "paragraphs"
                    widget: "list"
                    field: { label: "Paragraph", name: "text", widget: "text" }
          - { label: "Professional Memberships Section Eyebrow", name: "membershipsEyebrow", widget: "string" }

  - name: "memberships"
    label: "Memberships"
    files:
      - file: "content/memberships.json"
        label: "Professional Memberships"
        name: "memberships"
        fields:
          - label: "Memberships"
            name: "memberships"
            widget: "list"
            summary: "{{name}}"
            hint: "Shown on the Skills page."
            fields:
              - { label: "Organization Name", name: "name", widget: "string" }
              - { label: "Years", name: "years", widget: "string" }

  - name: "media"
    label: "Media Gallery"
    files:
      - file: "content/media.json"
        label: "Gallery Albums"
        name: "media"
        fields:
          - label: "Albums"
            name: "albums"
            widget: "list"
            summary: "{{title}} ({{category}})"
            fields:
              - { label: "Album Title", name: "title", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Political Work", value: "political" }
                  - { label: "Student Leadership", value: "student" }
                  - { label: "Community Service", value: "community" }
                  - { label: "Business", value: "business" }
                  - { label: "Media & Press", value: "media" }
                  - { label: "Faith & Culture", value: "faith" }
                  - { label: "Personal & Social", value: "personal" }
              - { label: "Default Caption (lightbox)", name: "caption", widget: "string", required: false }
              - label: "Photos"
                name: "photos"
                widget: "list"
                summary: "{{fields.src}}"
                fields:
                  - { label: "Image", name: "src", widget: "image" }
                  - { label: "Caption Override", name: "caption", widget: "string", required: false }
              - label: "Videos"
                name: "videos"
                widget: "list"
                required: false
                hint: "Paste a YouTube/Vimeo link rather than uploading large raw video files."
                fields:
                  - { label: "Video URL", name: "url", widget: "string" }
                  - { label: "Caption", name: "caption", widget: "string", required: false }
