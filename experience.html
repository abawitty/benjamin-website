<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experience | Addo Benjamin Armah</title>
<meta name="description" content="Addo Benjamin Armah, law, leadership, and development. Legal advisory, governance, and Lawbenpina Ventures import services.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,450;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1B2D; --ink-soft:#182A44; --paper:#F3EFE4; --paper-dim:#E7E1D2;
  --gold:#B98F3D; --gold-soft:#D8B872; --clay:#9A4B36; --green:#3E6B4F;
  --line:rgba(243,239,228,0.14); --line-dark:rgba(15,27,45,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto;}*{animation-duration:0.01ms !important;transition-duration:0.01ms !important;}}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold-soft);}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:450;letter-spacing:-0.01em;}
h1{font-size:clamp(34px,5vw,58px);line-height:1.05;margin:14px 0 18px;}
h2{font-size:clamp(26px,3.4vw,36px);margin-bottom:10px;}
h3{font-size:20px;margin-bottom:8px;}
p{color:rgba(243,239,228,0.82);text-align:justify;hyphens:auto;}
.wrap{max-width:1080px;margin:0 auto;padding:0 32px;}

/* -------- nav -------- */
nav{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(15,27,45,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;}
.brandmark{display:flex;align-items:center;gap:10px;}
.brandmark .monogram{height:32px;width:auto;}
.foot-logo{height:34px;width:auto;opacity:0.9;}
.brandmark span{font-family:'Fraunces',serif;font-size:16px;letter-spacing:0.02em;}
.navlinks{display:flex;gap:22px;font-size:13.5px;align-items:center;}
.navlinks a{opacity:0.65;transition:opacity .2s;padding-bottom:4px;border-bottom:1px solid transparent;}
.navlinks a:hover,.navlinks a.active{opacity:1;border-bottom-color:var(--gold);}
.navlinks a.active{color:var(--gold-soft);}
.navlinks .nav-cta{opacity:1;background:var(--green);color:#fff;padding:8px 14px;border-radius:999px;font-size:12.5px;border:none;}
.navmenu-btn{display:none;background:none;border:1px solid var(--line);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;}
@media (max-width:860px){.navlinks{display:none;}.navmenu-btn{display:block;}}

/* -------- hero / pagehero -------- */
.hero{padding:150px 0 90px;position:relative;overflow:hidden;}
.hero-bg-lines{position:absolute;inset:0;background:
  repeating-linear-gradient(115deg,transparent,transparent 78px,rgba(185,143,61,0.05) 79px,rgba(185,143,61,0.05) 80px);
  pointer-events:none;}
.hero-inner{position:relative;}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;}
.tag{border:1px solid var(--line);padding:7px 14px;border-radius:999px;font-size:12.5px;color:var(--gold-soft);}
.lede{max-width:640px;font-size:18px;margin-top:6px;}
.hero-ctas{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px;}

.pagehero{padding:130px 0 56px;position:relative;}
.pagehero-bg{position:absolute;inset:0;background:linear-gradient(180deg,rgba(185,143,61,0.06),transparent);pointer-events:none;}
.pagehero .wrap{position:relative;}

.hero-bg-slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.8s ease;}
.hero-bg-slide.active{opacity:1;}
.pagehero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,27,45,0.55),rgba(15,27,45,0.88));}

/* -------- buttons -------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:999px;font-size:14px;border:1px solid var(--line);transition:all .2s;}
.btn-primary{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600;}
.btn-primary:hover{background:var(--gold-soft);}
.btn-ghost{color:var(--paper);}
.btn-ghost:hover{border-color:var(--gold-soft);color:var(--gold-soft);}
.btn-wa{background:var(--green);color:#fff;border-color:var(--green);font-weight:600;}
.btn-wa:hover{background:#4c7f5e;}

/* -------- stats -------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:64px;border-top:1px solid var(--line);padding-top:36px;}
.stat b{display:block;font-family:'Fraunces',serif;font-size:32px;color:var(--gold-soft);}
.stat span{font-size:13px;color:rgba(243,239,228,0.6);}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,1fr);}}

/* -------- sections -------- */
section{padding:64px 0;border-top:1px solid var(--line);}
.section-head{margin-bottom:34px;}
.section-head p{max-width:620px;margin-top:8px;}

/* -------- explore cards -------- */
.explore-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.explore-card{border:1px solid var(--line);border-radius:16px;padding:26px;transition:border-color .2s, transform .2s;}
.explore-card:hover{border-color:var(--gold-soft);transform:translateY(-3px);}
.explore-card p{font-size:14px;margin-top:6px;}
@media (max-width:760px){.explore-grid{grid-template-columns:1fr;}}

/* -------- venture callout -------- */
.venture-banner{background:linear-gradient(120deg,var(--ink-soft),var(--ink));border:1px solid var(--gold);border-radius:20px;padding:36px;display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center;}
.venture-banner .eyebrow{color:var(--clay);}
.venture-banner ul{margin:16px 0 0 18px;color:rgba(243,239,228,0.85);font-size:14.5px;}
.venture-banner li{margin-bottom:6px;}
.venture-side{background:rgba(185,143,61,0.08);border:1px dashed var(--gold-soft);border-radius:14px;padding:22px;text-align:center;}
.venture-side .wa-number{font-family:'IBM Plex Mono',monospace;font-size:19px;color:var(--gold-soft);margin:10px 0 18px;}
@media (max-width:760px){.venture-banner{grid-template-columns:1fr;}}

/* -------- entry rows (experience/education) -------- */
.entry-cluster{margin-bottom:8px;}
.entry-cluster .eyebrow{display:block;margin:36px 0 14px;}
.entry{border-top:1px solid var(--line);padding:26px 0;display:grid;grid-template-columns:230px 1fr;gap:24px;}
.entry:first-of-type{border-top:none;}
.entry-meta .org{font-weight:600;font-size:15px;}
.entry-meta .date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(243,239,228,0.55);margin-top:4px;}
.entry-body p{margin-bottom:10px;font-size:15px;}
@media (max-width:700px){.entry{grid-template-columns:1fr;gap:8px;}}

/* -------- legal tree -------- */
.lt-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:40px;align-items:start;}
.lt-list{border:1px solid var(--line);border-radius:14px;padding:22px;}
.lt-list div{padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;}
.lt-list div:last-child{border-bottom:none;}
@media (max-width:760px){.lt-grid{grid-template-columns:1fr;}}

/* -------- skills grid -------- */
.skill-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
.skill-card{border:1px solid var(--line);border-radius:14px;padding:22px;}
.skill-card p{font-size:14.5px;margin-top:8px;}
@media (max-width:700px){.skill-grid{grid-template-columns:1fr;}}

.member-list{margin-top:18px;}
.member-row{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);font-size:14px;}
.member-row span:last-child{color:rgba(243,239,228,0.55);font-family:'IBM Plex Mono',monospace;font-size:12px;}

/* -------- publications -------- */
.pub-card{border:1px solid var(--line);border-radius:16px;padding:32px;}
.pub-meta{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 22px;}
.pub-meta span{border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:12px;color:var(--gold-soft);}
.pub-card blockquote{border-left:2px solid var(--gold);padding-left:18px;margin:20px 0;font-style:italic;color:rgba(243,239,228,0.75);}
.toc{margin-top:22px;font-size:14px;}
.toc div{padding:8px 0;border-top:1px solid var(--line);}

/* -------- media -------- */
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.media-slot{aspect-ratio:4/3;background:var(--ink-soft);border:1px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:rgba(243,239,228,0.5);padding:10px;}
@media (max-width:700px){.media-grid{grid-template-columns:1fr 1fr;}}

/* -------- contact -------- */
.contact-links{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:40px;}
.contact-links a{padding:12px 20px;border:1px solid var(--line);border-radius:999px;font-size:14px;}
.contact-links a:hover{border-color:var(--gold-soft);}
.form-grid{display:grid;gap:14px;max-width:560px;}
.form-grid input,.form-grid textarea{background:transparent;border:1px solid var(--line);border-radius:10px;padding:13px 16px;color:var(--paper);font-family:'Inter',sans-serif;font-size:14px;}
.form-grid input::placeholder,.form-grid textarea::placeholder{color:rgba(243,239,228,0.4);}

/* -------- footer -------- */
.site-footer{border-top:1px solid var(--line);padding:40px 0;}
.foot-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.foot-brand{font-family:'Fraunces',serif;font-size:17px;}
.foot-tag{font-size:12.5px;color:rgba(243,239,228,0.55);margin-top:2px;}
.foot-bottom{display:flex;justify-content:space-between;font-size:12.5px;color:rgba(243,239,228,0.45);flex-wrap:wrap;gap:8px;}
</style>
</head>
